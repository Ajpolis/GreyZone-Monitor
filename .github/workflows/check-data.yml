# Runs the data checker on every push and pull request.
# A red cross on GitHub means scripts/validate.py found an error; open the
# failed run to see which incident and field it points at.
name: Check data

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the data checker
        run: python3 scripts/validate.py
